<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain MVP - To Do</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-zinc-950 text-white p-6 max-w-md mx-auto sans-serif">
    <h1 class="text-3xl font-bold border-b border-zinc-800 pb-2 mb-6">🧠 TO DO []</h1>
    <div class="flex gap-2 mb-6">
        <input type="text" id="taskInput" placeholder="Añadir nota al cerebro cloud..." class="flex-1 p-2 bg-zinc-900 border border-zinc-800 rounded text-white focus:outline-none">
        <button onclick="addTask()" class="bg-yellow-500 text-black px-4 py-2 font-bold rounded hover:bg-yellow-400 cursor-pointer">Add</button>
    </div>
    <ul id="todoList" class="space-y-3"></ul>
    <script>
        // URL Corregida e idéntica a tu panel de Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_YGYlo1pgW8pyN05_R8i8iw==";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function fetchTodos() {
            const { data, error } = await supabaseClient.from('todos').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            data.forEach(todo => {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded border border-zinc-900 ${todo.is_completed ? 'bg-zinc-900/50 line-through text-zinc-500' : 'bg-zinc-900'}`;
                li.innerHTML = `<span>${todo.task}</span><div class="flex gap-2"><button onclick="toggleTodo(${todo.id}, ${todo.is_completed})" class="text-xs bg-zinc-800 px-2 py-1 rounded">✓</button><button onclick="deleteTodo(${todo.id})" class="text-xs bg-red-950/40 text-red-400 px-2 py-1 rounded">✕</button></div>`;
                list.appendChild(li);
            });
        }
        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            const { error } = await supabaseClient.from('todos').insert([{ task: input.value }]);
            if (error) console.error(error);
            input.value = '';
            fetchTodos();
        }
        async function toggleTodo(id, currentStatus) {
            await supabaseClient.from('todos').update({ is_completed: !currentStatus }).eq('id', id);
            fetchTodos();
        }
        async function deleteTodo(id) {
            await supabaseClient.from('todos').delete().eq('id', id);
            fetchTodos();
        }
        fetchTodos();
    </script>
</body>
</html>
